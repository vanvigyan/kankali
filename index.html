  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

al value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"9a94b9fb-e8a1-41e1-9f22-bb827b04d691\"><\u002Fscript>\n<script src=\"f0879eed-c8a8-4321-903d-4ab0f3bc3c2c\"><\u002Fscript>\n<script src=\"91c94930-8f99-4119-b437-0ec716ae50ff\"><\u002Fscript>\n<style>\nbody{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}\na{color:var(--color-accent-700)}a:hover{color:var(--color-accent-600)}\n*{box-sizing:border-box}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;background:var(--color-bg);\">\n  <nav class=\"nav\" style=\"max-width:1320px;margin:0 auto;padding:var(--space-4) var(--space-6);flex-wrap:wrap;\">\n    <div class=\"nav-brand\" style=\"display:flex;align-items:center;gap:10px;font-size:20px;\">\n      <span style=\"width:30px;height:30px;border-radius:50%;background:var(--color-accent-2);display:inline-flex;align-items:center;justify-content:center;\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f5ead8\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22v-7\"><\u002Fpath><path d=\"M17 8.5A5 5 0 0 0 7 8.5a4 4 0 0 0-2 7.5h14a4 4 0 0 0-2-7.5Z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      Forest Change Monitor\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;\">\n      <span class=\"tag tag-accent-2\">65 plots<\u002Fspan>\n      <span class=\"tag tag-neutral\">2006 → 2016<\u002Fspan>\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ openPdf }}\" style=\"padding:9px 18px;\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V3\"><\u002Fpath><path d=\"m7 10 5 5 5-5\"><\u002Fpath><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><\u002Fsvg>\n        PDF bubble report\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"max-width:1320px;margin:0 auto;padding:0 var(--space-6) 64px;display:flex;flex-direction:column;gap:22px;\">\n\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px;align-items:end;padding-top:8px;\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);\">{{ scopeLabel }}<\u002Fdiv>\n        <h1 style=\"margin:0;font-family:var(--font-heading);font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.02;text-wrap:balance;\">{{ headline }}<\u002Fh1>\n        <p style=\"margin:0;max-width:560px;font-size:16px;line-height:1.5;color:var(--color-neutral-800);text-wrap:pretty;\">{{ subline }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;background:var(--color-surface);border-radius:32px;padding:18px 20px;\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;\">\n          <div class=\"field\" style=\"display:block;\">\n            <label>Plot<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ plotVal }}\" sc-camel-on-change=\"{{ onPlot }}\" style=\"background:var(--color-neutral-100);\">\n              <sc-for list=\"{{ plotOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"display:block;\">\n            <label>Species<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ spVal }}\" sc-camel-on-change=\"{{ onSp }}\" style=\"background:var(--color-neutral-100);\">\n              <sc-for list=\"{{ spOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option v 0px;\">\n          <span>{{ plotMaxLbl }}<\u002Fspan><span>0<\u002Fspan><span>{{ plotMinLbl }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:2px;height:190px;min-width:0;\">\n          <sc-for list=\"{{ plotBars }}\" as=\"p\" hint-placeholder-count=\"65\">\n            <div sc-camel-on-click=\"{{ p.pick }}\" title=\"{{ p.tip }}\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer;border-radius:4px;background:{{ p.bg }};\" style-hover=\"background:var(--color-neutral-200);\">\n              <div style=\"flex:1;display:flex;align-items:flex-end;\"><div style=\"width:100%;height:{{ p.up }};background:{{ p.upc }};border-radius:4px 4px 0 0;\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"height:1px;background:var(--color-neutral-500);\"><\u002Fdiv>\n              <div style=\"flex:1;display:flex;align-items:flex-start;\"><div style=\"width:100%;height:{{ p.dn }};background:{{ p.dnc }};border-radius:0 0 4px 4px;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--color-neutral-700);padding-left:48px;\">\n        <span>{{ plotFirst }}<\u002Fspan><span>Plot number<\u002Fspan><span>{{ plotLast }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"display:flex;flex-direction:column;gap:10px;padding:6px 4px;\">\n        <div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);\">Data notes<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px 28px;font-size:13px;line-height:1.5;color:var(--color-neutral-800);\">\n          <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"4\"><div style=\"text-wrap:pretty;\">{{ n }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ pdfOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closePdf }}\" style=\"z-index:50;\">\n      <div class=\"dialog\" sc-camel-on-click=\"{{ stop }}\" style=\"width:min(460px,100%);gap:16px;\">\n        <div class=\"dialog-title\">Bubble diagram report<\u002Fdiv>\n        <div class=\"dialog-body\" style=\"line-height:1.45;\">One A4 page per plot: every tree drawn at its X/Y position, sized by DBH and coloured by species, with a species summary table.<\u002Fdiv>\n        <div class=\"field\" style=\"display:block;\">\n          <label>Plot<\u002Flabel>\n          <sc-raw-select class=\"input\" value=\"{{ pdfPlotVal }}\" sc-camel-on-change=\"{{ onPdfPlot }}\" style=\"background:var(--color-neutral-100);\">\n            <sc-for list=\"{{ pdfPlotOpts }}\" as=\"o\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Survey year<\u002Flabel>\n          <div class=\"seg\" style=\"background:var(--color-neutral-100);\">\n            <sc-for list=\"{{ pdfYearOpts }}\" as=\"o\"><label class=\"seg-opt\" style=\"position:relative;padding:8px 22px;\"><input type=\"radio\" name=\"pdfy\" checked=\"{{ o.on }}\" sc-camel-on-change=\"{{ o.pick }}\" style=\"position:absolute;opacity:0;width:0;height:0;\">{{ o.l }}<\u002Flabel><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-accent-800);min-height:16px;\">{{ pdfMsg }}<\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closePdf }}\" style=\"padding:9px 18px;\">Cancel<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ genPdf }}\" style=\"padding:9px 18px;\">Download PDF<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;plotSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:25,&quot;min&quot;:5,&quot;max&quot;:100,&quot;unit&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Analysis&quot;},&quot;colorBy&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;species&quot;,&quot;status&quot;],&quot;default&quot;:&quot;species&quot;,&quot;tsType&quot;:&quot;'species'|'status'&quot;,&quot;section&quot;:&quot;Maps&quot;},&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nconst h = React.createElement;\nconst Y = ['', '2006', '2016'];\nconst PAL = ['#728157', '#d67f48', '#8c491a', '#aebf92', '#e0a44f', '#3d472b', '#9c5a6b', '#5f7f86'];\nconst PDFPAL = ['#728157', '#d67f48', '#8c491a', '#aebf92', '#e0a44f', '#3d472b', '#9c5a6b', '#5f7f86', '#f6a06b', '#402310', '#b7a36a', '#7d6f9c'];\nconst OTHER = '#c0b6a5';\nconst ST = { surv: '#56633f', died: '#c67139', rec: '#aebf92' };\nconst DBHC = [{ l: 'All' }, { l: '<10', lo: 0, hi: 10 }, { l: '10–20', lo: 10, hi: 20 }, { l: '20–30', lo: 20, hi: 30 }, { l: '30+', lo: 30, hi: 1e9 }];\nconst HC = [{ l: 'All' }, { l: '<5 m', lo: 0, hi: 5 }, { l: '5–10', lo: 5, hi: 10 }, { l: '10–15', lo: 10, hi: 15 }, { l: '15+', lo: 15, hi: 1e9 }];\nconst mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;\nconst f1 = v => isNaN(v) ? '–' : v.toFixed(1);\nconst fmt = v => Math.round(v).toLocaleString('en-US');\nconst pctS = (a, b) => a ? ((b - a) / a * 100) : NaN;\nconst sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v);\nconst pctL = (a, b) => { if (!a && !b) return '–'; const p = pctS(a, b); return isNaN(p) ? 'new' : (p > 0 ? '+' : p < 0 ? '−' : '±') + Math.abs(p).toFixed(0) + '%'; };\nconst hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));\nconst lerp = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };\n\nclass Component extends DCLogic {\n  state = { ready: false, plot: 'all', sp: 'all', dbh: 0, ht: 0, colorBy: null, hover: null, pdfOpen: false, pdfPlot: 'all', pdfYear: 2, pdfMsg: '' };\n\n  componentDidMount() {\n    const go = () => { if (window.__FD) this.decode(); else setTimeout(go, 60); };\n    go();\n  }\n\n  decode() {\n    const s = atob(window.__FD), k = 'kaTh-forest-26';\n    let o = '';\n    for (let i = 0; i < s.length; i++) o += String.fromCharCode(s.charCodeAt(i) ^ k.charCodeAt(i % k.length));\n    const J = JSON.parse(o), f = J.d, v = n => n < 0 ? null : n / 10;\n    const trees = [];\n    for (let i = 0; i < f.length; i += 8) trees.push({ id: i / 8, p: J.p[f[i]], x: v(f[i + 1]), y: v(f[i + 2]), s: f[i + 3], d: [null, v(f[i + 4]), v(f[i + 6])], h: [null, v(f[i + 5]), v(f[i + 7])] });\n    const species = J.s.map((a, i) => ({ name: a[0], local: a[1], color: i < PAL.length ? PAL[i] : OTHER }));\n    const dom = {};\n    J.p.forEach(p => { dom[p] = 25; });\n    trees.forEach(t => { const m = Math.max(t.x || 0, t.y || 0); if (m > dom[t.p]) dom[t.p] = Math.ceil(m / 5) * 5; });\n    this.D = { plots: J.p, species, trees, dom };\n    delete window.__FD;\n    this.setState({ ready: true });\n  }\n\n  area() { const s = this.props.plotSize ?? 25; return s * s / 10000; }\n\n  inSize(t, y) {\n    const { dbh, ht } = this.state;\n    if (dbh) { const c = DBHC[dbh]; if (!(t.d[y] >= c.lo && t.d[y] < c.hi)) return false; }\n    if (ht) { const c = HC[ht]; if (t.h[y] == null || !(t.h[y] >= c.lo && t.h[y] < c.hi)) return false; }\n    return true;\n  }\n  sel(y, o = {}) {\n    const { plot, sp } = this.state;\n    return this.D.trees.filter(t => t.d[y] != null && (o.anyPlot || plot === 'all' || t.p === plot) && (o.anySp || sp === 'all' || t.s === sp) && this.inSize(t, y));\n  }\n  stats(L, y, nP) {\n    const ha = nP * this.area(), c = {};\n    L.forEach(t => { c[t.s] = (c[t.s] || 0) + 1; });\n    const H = -Object.values(c).reduce((s, n) => s + n / L.length * Math.log(n / L.length), 0);\n    return {\n      n: L.length, ha: L.length / ha, rich: Object.keys(c).length, counts: c, H: L.length ? H : NaN,\n      d: mean(L.map(t => t.d[y])), h: mean(L.filter(t => t.h[y] != null).map(t => t.h[y])),\n      ba: L.reduce((s, t) => s + Math.PI * (t.d[y] / 200) ** 2, 0) / ha\n    };\n  }\n  bars(labels, A, B) {\n    const m = Math.max(1, ...A, ...B);\n    return labels.map((l, i) => ({\n      label: l, a: A[i], b: B[i], ha: (A[i] / m * 82) + '%', hb: (B[i] / m * 82) + '%',\n      ta: `2006: ${A[i]} stems`, tb: `2016: ${B[i]} stems`,\n      d: pctL(A[i], B[i]), dc: B[i] >= A[i] ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)'\n    }));\n  }\n  bin(L, key, y, edges) {\n    const r = edges.map(() => 0);\n    L.forEach(t => { const v = key(t, y); if (v == null) return; let i = edges.findIndex(e => v >= e.lo && v < e.hi); if (i < 0) i = edges.length - 1; r[i]++; });\n    return r;\n  }\n\n  mapSvg(y, L, cb) {\n    const D = this.D, dom = D.dom[this.state.plot], W = 330, Lp = 30, T = 8, S = 290;\n    const sx = v => Lp + v / dom * S, sy = v => T + S - v / dom * S;\n    const els = [h('rect', { key: 'bg', x: Lp, y: T, width: S, height: S, rx: 16, fill: '#f9f4ed' })];\n    for (let v = 0; v <= dom; v += 5) {\n      els.push(h('line', { key: 'gx' + v, x1: sx(v), x2: sx(v), y1: T, y2: T + S, stroke: 'rgba(32,30,29,.08)' }));\n      els.push(h('line', { key: 'gy' + v, y1: sy(v), y2: sy(v), x1: Lp, x2: Lp + S, stroke: 'rgba(32,30,29,.08)' }));\n      els.push(h('text', { key: 'tx' + v, x: sx(v), y: T + S + 14, fontSize: 10, textAnchor: 'middle', fill: '#645c50' }, v));\n      els.push(h('text', { key: 'ty' + v, x: Lp - 6, y: sy(v) + 3, fontSize: 10, textAnchor: 'end', fill: '#645c50' }, v));\n    }\n    els.push(h('text', { key: 'xl', x: Lp + S, y: T + S + 28, fontSize: 10, textAnchor: 'end', fill: '#645c50' }, 'X axis (m) →'));\n    const hv = this.state.hover, k = S / dom * 0.12;\n    const pts = L.filter(t => t.y != null).sort((a, b) => b.d[y] - a.d[y]);\n    pts.forEach(t => {\n      const col = cb === 'status' ? (y === 1 ? (t.d[2] != null ? ST.surv : ST.died) : (t.d[1] != null ? ST.surv : ST.rec)) : D.species[t.s].color;\n      const on = hv === t.id;\n      els.push(h('circle', {\n        key: 't' + t.id, cx: sx(t.x), cy: sy(t.y), r: Math.max(2, Math.sqrt(t.d[y]) * k), fill: col, fillOpacity: hv != null && !on ? 0.45 : 0.82,\n        stroke: on ? '#201e1d' : '#f9f4ed', strokeWidth: on ? 2.4 : 0.8, style: { cursor: 'pointer' },\n        onMouseEnter: () => this.setState({ hover: t.id })\n      }));\n    });\n    if (hv != null) {\n      const t = D.trees[hv];\n      if (t && t.p === this.state.plot && t.d[y] == null && t.y != null) {\n        const o = t.d[3 - y];\n        els.push(h('circle', { key: 'ghost', cx: sx(t.x), cy: sy(t.y), r: Math.max(3, Math.sqrt(o) * k), fill: 'none', stroke: '#201e1d', strokeWidth: 1.6, strokeDasharray: '3 3' }));\n      }\n    }\n    return h('svg', { viewBox: `0 0 ${W} ${T + S + 34}`, width: '100%', style: { display: 'block', fontFamily: 'Figtree, sans-serif' } }, els);\n  }\n\n  heatSvg(grid, mode, max) {\n    const Lp = 30, T = 8, S = 290, c = S / 5, els = [];\n    for (let r = 0; r < 5; r++) for (let q = 0; q < 5; q++) {\n      const v = grid[r][q];\n      let fill, t;\n      if (mode === 'delta') { t = Math.min(1, Math.abs(v) / (max || 1)); fill = v >= 0 ? lerp('#f9f4ed', '#56633f', t) : lerp('#f9f4ed', '#b2622d', t); }\n      else { t = Math.min(1, v / (max || 1)); fill = lerp('#f9f4ed', '#3d472b', t); }\n      const x = Lp + q * c, yy = T + (4 - r) * c;\n      els.push(h('rect', { key: `c${r}${q}`, x: x + 2, y: yy + 2, width: c - 4, height: c - 4, rx: 14, fill }));\n      els.push(h('text', { key: `t${r}${q}`, x: x + c / 2, y: yy + c / 2 + 5, fontSize: 14, fontWeight: 700, textAnchor: 'middle', fill: t > 0.55 ? '#f9f4ed' : '#201e1d' }, mode === 'delta' ? sgn(v) : v));\n    }\n    for (let v = 0; v <= 25; v += 5) {\n      els.push(h('text', { key: 'tx' + v, x: Lp + v / 25 * S, y: T + S + 14, fontSize: 10, textAnchor: 'middle', fill: '#645c50' }, v));\n      els.push(h('text', { key: 'ty' + v, x: Lp - 6, y: T + S - v / 25 * S + 3, fontSize: 10, textAnchor: 'end', fill: '#645c50' }, v));\n    }\n    els.push(h('text', { key: 'xl', x: Lp + S, y: T + S + 28, fontSize: 10, textAnchor: 'end', fill: '#645c50' }, 'X axis (m) →'));\n    return h('svg', { viewBox: `0 0 330 ${T + S + 34}`, width: '100%', style: { display: 'block', fontFamily: 'Figtree, sans-serif' } }, els);\n  }\n\n  async genPdf() {\n    const J = window.jspdf;\n    if (!J) { this.setState({ pdfMsg: 'PDF engine is still loading — try again in a moment.' }); return; }\n    this.setState({ pdfMsg: 'Building report…' });\n    await new Promise(r => setTimeout(r, 30));\n    const { pdfPlot, pdfYear } = this.state;\n    const doc = new J.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });\n    const plots = pdfPlot === 'all' ? this.D.plots : [pdfPlot];\n    plots.forEach((p, i) => { if (i) doc.addPage(); this.pdfPage(doc, p, pdfYear, i + 1, plots.length); });\n    doc.save(`bubble-report_${pdfPlot === 'all' ? 'all-plots' : 'plot-' + pdfPlot}_${Y[pdfYear]}.pdf`);\n    this.setState({ pdfMsg: '', pdfOpen: false });\n  }\n\n  pdfPage(doc, p, y, pg, tot) {\n    const D = this.D, L = D.trees.filter(t => t.p === p && t.d[y] != null), dom = D.dom[p];\n    doc.setTextColor('#201e1d'); doc.setFont('helvetica', 'bold'); doc.setFontSize(18);\n    doc.text(`Plot ${p}  ·  Tree species bubble diagram  ·  ${Y[y]}`, 14, 16);\n    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor('#645c50');\n    doc.text('Each bubble is one tree at its measured X/Y position within the plot. Bubble size scales with DBH (value in cm printed on each bubble); colour identifies species.', 14, 22);\n    const Lp = 30, T = 30, S = 158, sx = v => Lp + v / dom * S, sy = v => T + S - v / dom * S;\n    doc.setDrawColor('#dcd3c4'); doc.setLineWidth(0.2); doc.setFontSize(7.5); doc.setTextColor('#645c50');\n    for (let v = 0; v <= dom; v += 5) {\n      doc.line(sx(v), T, sx(v), T + S); doc.line(Lp, sy(v), Lp + S, sy(v));\n      doc.text(String(v), sx(v), T + S + 4.5, { align: 'center' });\n      doc.text(String(v), Lp - 2, sy(v) + 1, { align: 'right' });\n    }\n    doc.setFontSize(8.5); doc.text('X axis (m)', Lp + S / 2, T + S + 11, { align: 'center' });\n    doc.text('Y axis (m)', Lp - 9, T + S / 2 + 7, { angle: 90 });\n    const cnt = {};\n    L.forEach(t => { cnt[t.s] = (cnt[t.s] || 0) + 1; });\n    const order = Object.keys(cnt).map(Number).sort((a, b) => cnt[b] - cnt[a]);\n    const col = {};\n    order.forEach((s, i) => { col[s] = i < PDFPAL.length ? PDFPAL[i] : OTHER; });\n    const k = S / dom * 0.12;\n    doc.setGState(new doc.GState({ opacity: 0.82 }));\n    doc.setDrawColor('#ffffff'); doc.setLineWidth(0.25);\n    L.filter(t => t.y != null).sort((a, b) => b.d[y] - a.d[y]).forEach(t => {\n      doc.setFillColor(col[t.s]); doc.circle(sx(t.x), sy(t.y), Math.max(0.8, Math.sqrt(t.d[y]) * k), 'FD');\n    });\n    doc.setGState(new doc.GState({ opacity: 1 }));\n    doc.setFont('helvetica', 'bold'); doc.setFontSize(dom > 25 ? 4.2 : 5); doc.setTextColor('#201e1d');\n    L.filter(t => t.y != null).forEach(t => {\n      doc.text(String(t.d[y]), sx(t.x), sy(t.y) + 0.6, { align: 'center' });\n    });\n    const st = this.stats(L, y, 1), x0 = 200;\n    doc.setTextColor('#201e1d'); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Plot summary', x0, 32);\n    const sum = [['Stems', fmt(st.n)], ['Stems / ha', fmt(st.ha)], ['Species', String(st.rich)], ['Mean DBH', f1(st.d) + ' cm'], ['Mean height', f1(st.h) + ' m'], ['Basal area', f1(st.ba) + ' m²/ha']];\n    sum.forEach((r, i) => {\n      const cx = x0 + (i % 3) * 29, cy = 40 + Math.floor(i / 3) * 12;\n      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor('#201e1d'); doc.text(r[1].replace('m²', 'm2'), cx, cy);\n      doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor('#645c50'); doc.text(r[0], cx, cy + 4);\n    });\n    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor('#201e1d'); doc.text('Species', x0, 70);\n    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor('#645c50');\n    doc.text('Stems', x0 + 58, 70, { align: 'right' }); doc.text('DBH cm', x0 + 71, 70, { align: 'right' }); doc.text('Ht m', x0 + 83, 70, { align: 'right' });\n    let rows = order.slice(0, 13);\n    const rest = order.slice(13);\n    rows.forEach((s, i) => {\n      const ry = 77 + i * 8.2, Ls = L.filter(t => t.s === s);\n      doc.setFillColor(col[s]); doc.circle(x0 + 2, ry - 1, 1.9, 'F');\n      doc.setTextColor('#201e1d'); doc.setFont('helvetica', 'italic'); doc.setFontSize(8.2);\n      const nm = D.species[s].name;\n      doc.text(nm.length > 30 ? nm.slice(0, 29) + '…' : nm, x0 + 6, ry);\n      doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor('#645c50');\n      doc.text(D.species[s].local, x0 + 6, ry + 3);\n      doc.setFontSize(8.2); doc.setTextColor('#201e1d');\n      doc.text(String(Ls.length), x0 + 58, ry, { align: 'right' });\n      doc.text(f1(mean(Ls.map(t => t.d[y]))), x0 + 71, ry, { align: 'right' });\n      doc.text(f1(mean(Ls.filter(t => t.h[y] != null).map(t => t.h[y]))), x0 + 83, ry, { align: 'right' });\n    });\n    if (rest.length) { doc.setFontSize(7); doc.setTextColor('#645c50'); doc.text(`+ ${rest.length} more species (${rest.reduce((s, r) => s + cnt[r], 0)} stems), shown in grey`, x0 + 6, 77 + rows.length * 8.2); }\n    if (!L.length) { doc.setFontSize(10); doc.setTextColor('#8c491a'); doc.text(`No trees recorded in this plot in ${Y[y]}.`, x0, 80); }\n    doc.setFontSize(7.5); doc.setTextColor('#645c50'); doc.text('DBH size key', x0, 178);\n    [10, 30, 60].forEach((d, i) => {\n      const r = Math.sqrt(d) * k, cx = x0 + 6 + i * 18;\n      doc.setDrawColor('#82796a'); doc.setLineWidth(0.3); doc.circle(cx, 190 - r, r, 'S');\n      doc.text(d + ' cm', cx, 195, { align: 'center' });\n    });\n    doc.setFontSize(7); doc.setTextColor('#82796a');\n    doc.text(`Forest Change Monitor  ·  Generated ${new Date().toISOString().slice(0, 10)}  ·  Page ${pg} of ${tot}`, 14, 204);\n  }\n\n  renderVals() {\n    const s = this.state, P = this.props;\n    const plotOptsBase = [{ v: 'all', l: 'All 65 plots' }];\n    if (!s.ready) return { headline: 'Reading the forest…', plotOpts: plotOptsBase, spOpts: [{ v: 'all', l: 'All species' }], kpis: [], insights: [], demo: [], demoStats: [], classCharts: [], maps: [], axisCharts: [], spRows: [], growth: [], plotBars: [], legend: [], notes: [], showNotes: false, openPdf: () => {}, scopeLabel: '', subline: '', annualMort: '', mapTitle: '', mapSub: '', spFoot: '', growthFoot: '', plotMaxLbl: '', plotMinLbl: '', plotFirst: '', plotLast: '' };\n    const D = this.D, isPlot = s.plot !== 'all', nP = isPlot ? 1 : D.plots.length;\n    const cb = s.colorBy ?? P.colorBy ?? 'species';\n    const L1 = this.sel(1), L2 = this.sel(2), S1 = this.stats(L1, 1, nP), S2 = this.stats(L2, 2, nP);\n    const died = L1.filter(t => t.d[2] == null).length, surv1 = L1.length - died;\n    const rec = L2.filter(t => t.d[1] == null).length, surv2 = L2.length - rec;\n    const up = (a, b) => b > a ? 'tag tag-accent-2' : b < a ? 'tag tag-accent' : 'tag tag-neutral';\n    const kpis = [\n      { label: 'Stems', v2: fmt(S2.n), unit: '', from: `from ${fmt(S1.n)} in 2006`, delta: pctL(S1.n, S2.n), tagCls: up(S1.n, S2.n) },\n      { label: 'Density', v2: fmt(S2.ha), unit: 'stems/ha', from: `from ${fmt(S1.ha)} in 2006`, delta: pctL(S1.ha, S2.ha), tagCls: up(S1.ha, S2.ha) },\n      { label: 'Species', v2: S2.rich, unit: 'recorded', from: `from ${S1.rich} in 2006`, delta: sgn(S2.rich - S1.rich), tagCls: up(S1.rich, S2.rich) },\n      { label: 'Mean DBH', v2: f1(S2.d), unit: 'cm', from: `from ${f1(S1.d)} cm in 2006`, delta: pctL(S1.d, S2.d), tagCls: up(S1.d, S2.d) },\n      { label: 'Mean height', v2: f1(S2.h), unit: 'm', from: `from ${f1(S1.h)} m in 2006`, delta: pctL(S1.h, S2.h), tagCls: up(S1.h, S2.h) },\n      { label: 'Basal area', v2: f1(S2.ba), unit: 'm²/ha', from: `from ${f1(S1.ba)} m²/ha in 2006`, delta: pctL(S1.ba, S2.ba), tagCls: up(S1.ba, S2.ba) }\n    ];\n    let headline;\n    if (!S1.n && !S2.n) headline = 'No trees match these filters.';\n    else if (S2.n < S1.n && S2.d > S1.d) headline = 'Fewer stems, bigger trees.';\n    else if (S2.n < S1.n) headline = 'A thinning, shrinking stand.';\n    else if (S2.d > S1.d) headline = 'More stems, and bigger ones.';\n    else headline = 'More stems, but smaller.';\n    const spName = s.sp === 'all' ? '' : D.species[s.sp].name;\n    const scopeLabel = [isPlot ? `Plot ${s.plot}` : 'All 65 plots', spName, s.dbh ? `DBH ${DBHC[s.dbh].l} cm` : '', s.ht ? `Height ${HC[s.ht].l}` : ''].filter(Boolean).join(' · ');\n    const subline = `Between the 2006 and 2016 surveys the ${isPlot ? 'plot' : 'forest'} went from ${fmt(S1.n)} to ${fmt(S2.n)} stems (${pctL(S1.n, S2.n)}), while basal area moved ${pctL(S1.ba, S2.ba)} — ${S2.ba > S1.ba && S2.n < S1.n ? 'the stand is consolidating into fewer, larger trees' : 'see the charts below for where the change happened'}.`;\n\n    // insights\n    const ins = [];\n    ins.push({ title: `Stems ${S2.n < S1.n ? 'fell' : 'rose'} ${pctL(S1.n, S2.n).replace(/^[+−]/, '')}`, body: `${fmt(died)} of ${fmt(S1.n)} trees from 2006 were not found in 2016, and ${fmt(rec)} new trees were recruited — a net change of ${sgn(S2.n - S1.n)} stems.` });\n    if (!isNaN(S1.d)) ins.push({ title: S2.d > S1.d ? 'Trees are getting bigger' : 'Trees are getting smaller', body: `Mean DBH moved ${f1(S1.d)} → ${f1(S2.d)} cm and mean height ${f1(S1.h)} → ${f1(S2.h)} m; basal area ${pctL(S1.ba, S2.ba)} to ${f1(S2.ba)} m²/ha despite ${S2.n < S1.n ? 'fewer' : 'more'} stems.` });\n    const small1 = L1.filter(t => t.d[1] < 10).length, small2 = L2.filter(t => t.d[2] < 10).length;\n    if (!s.dbh && small1 > 20) ins.push({ title: small2 < small1 ? 'Weak regeneration in small sizes' : 'Small stems are increasing', body: `Stems under 10 cm DBH went from ${fmt(small1)} to ${fmt(small2)} (${pctL(small1, small2)}). ${small2 < small1 * 0.6 ? 'Few young trees are replacing the ones moving into larger classes.' : ''}` });\n    if (s.sp === 'all' && S2.n) {\n      const top = Object.keys(S2.counts).sort((a, b) => S2.counts[b] - S2.counts[a])[0];\n      const sh1 = (S1.counts[top] || 0) / (S1.n || 1) * 100, sh2 = S2.counts[top] / S2.n * 100;\n      ins.push({ title: `${D.species[top].local} ${sh2 > sh1 ? 'dominance is growing' : 'share is easing'}`, body: `${D.species[top].name} makes up ${sh2.toFixed(0)}% of stems (was ${sh1.toFixed(0)}%). Species richness ${S1.rich} → ${S2.rich}; Shannon diversity ${f1(S1.H * 10) === '–' ? '–' : S1.H.toFixed(2)} → ${S2.H.toFixed(2)}.` });\n    }\n    const plotDelta = D.plots.map(p => {\n      const a = this.sel(1, { anyPlot: true }).filter(t => t.p === p).length, b = this.sel(2, { anyPlot: true }).filter(t => t.p === p).length;\n      return { p, a, b, d: b - a };\n    });\n    if (!isPlot) {\n      const down = plotDelta.filter(x => x.d < 0).length, zero = plotDelta.filter(x => x.a > 0 && x.b === 0).map(x => x.p);\n      ins.push({ title: `${down} of ${D.plots.length} plots lost stems`, body: zero.length ? `${zero.length} plots (${zero.join(', ')}) had trees in 2006 but none recorded in 2016 — confirm whether they were cleared or not re-measured.` : 'Losses are spread across the forest rather than concentrated in a few plots.' });\n    } else {\n      const rank = [...plotDelta].sort((a, b) => a.d - b.d).findIndex(x => x.p === s.plot) + 1;\n      ins.push({ title: `Rank ${rank} of ${D.plots.length} for stem loss`, body: `Plot ${s.plot} changed by ${sgn(S2.n - S1.n)} stems. Hover trees in the maps below to follow individual trees between surveys.` });\n    }\n    const insights = ins.slice(0, 5).map((x, i) => ({ ...x, n: i + 1 }));\n\n    // demography\n    const mx = Math.max(S1.n, S2.n, 1);\n    const seg = (n, c, tc, tip, tot) => ({ n: n ? fmt(n) : '', w: (tot ? n / tot * 100 : 0) + '%', c, tc, tip });\n    const demo = [\n      { year: '2006', w: (S1.n / mx * 100) + '%', segs: [seg(surv1, ST.surv, '#f0fae1', `${surv1} survived to 2016`, S1.n), seg(died, ST.died, '#fff2eb', `${died} lost since 2006`, S1.n)] },\n      { year: '2016', w: (S2.n / mx * 100) + '%', segs: [seg(surv2, ST.surv, '#f0fae1', `${surv2} survivors`, S2.n), seg(rec, ST.rec, '#272e1b', `${rec} new recruits`, S2.n)] }\n    ];\n    const mAnn = S1.n ? (1 - Math.pow(surv1 / S1.n, 1 / 10)) * 100 : NaN;\n    const demoStats = [\n      { v: S1.n ? (died / S1.n * 100).toFixed(0) + '%' : '–', l: 'of 2006 stems lost' },\n      { v: isNaN(mAnn) ? '–' : mAnn.toFixed(1) + '%', l: 'annual mortality' },\n      { v: S2.n ? (rec / S2.n * 100).toFixed(0) + '%' : '–', l: 'of 2016 stems are new' }\n    ];\n\n    const dE = DBHC.slice(1), hE = HC.slice(1);\n    const classCharts = [\n      { title: 'Diameter classes', sub: 'Stems per DBH class (cm) — the reverse-J shape of a regenerating forest is flattening', bars: this.bars(dE.map(e => e.l), this.bin(L1, (t, y) => t.d[y], 1, dE), this.bin(L2, (t, y) => t.d[y], 2, dE)) },\n      { title: 'Height classes', sub: 'Stems per height class (m) — the canopy is shifting upward', bars: this.bars(hE.map(e => e.l), this.bin(L1, (t, y) => t.h[y], 1, hE), this.bin(L2, (t, y) => t.h[y], 2, hE)) }\n    ];\n\n    // spatial\n    const axE = [0, 5, 10, 15, 20].map(v => ({ lo: v, hi: v + 5 }));\n    const axL = axE.map(e => `${e.lo}–${e.hi}`);\n    const axisCharts = [\n      { title: 'Stems along the X axis', sub: 'metres from plot origin', bars: this.bars(axL, this.bin(L1, t => t.x, 1, axE), this.bin(L2, t => t.x, 2, axE)) },\n      { title: 'Stems along the Y axis', sub: 'metres from plot origin', bars: this.bars(axL, this.bin(L1, t => t.y, 1, axE), this.bin(L2, t => t.y, 2, axE)) }\n    ];\n    let maps, legend = [];\n    if (isPlot) {\n      maps = [\n        { title: '2006', note: `${fmt(L1.length)} trees`, svg: this.mapSvg(1, L1, cb) },\n        { title: '2016', note: `${fmt(L2.length)} trees`, svg: this.mapSvg(2, L2, cb) }\n      ];\n      if (cb === 'status') legend = [{ c: ST.surv, l: 'Survived both surveys', n: surv1, fs: 'normal' }, { c: ST.died, l: 'Lost after 2006', n: died, fs: 'normal' }, { c: ST.rec, l: 'Recruited by 2016', n: rec, fs: 'normal' }];\n      else {\n        const c = {};\n        [...L1, ...L2].forEach(t => { c[t.s] = (c[t.s] || 0) + 1; });\n        const ks = Object.keys(c).map(Number).sort((a, b) => a - b);\n        const main = ks.filter(k => k < PAL.length), oth = ks.filter(k => k >= PAL.length);\n        legend = main.map(k => ({ c: D.species[k].color, l: D.species[k].name, n: `${S1.counts[k] || 0} → ${S2.counts[k] || 0}`, fs: 'italic' }));\n        if (oth.length) legend.push({ c: OTHER, l: `${oth.length} other species`, n: `${oth.reduce((a, k) => a + (S1.counts[k] || 0), 0)} → ${oth.reduce((a, k) => a + (S2.counts[k] || 0), 0)}`, fs: 'normal' });\n      }\n    } else {\n      const grid = L => { const g = [0, 1, 2, 3, 4].map(() => [0, 0, 0, 0, 0]); L.forEach(t => { if (t.y == null) return; g[Math.min(4, Math.floor(t.y / 5))][Math.min(4, Math.floor(t.x / 5))]++; }); return g; };\n      const g1 = grid(L1), g2 = grid(L2), gd = g1.map((r, i) => r.map((v, j) => g2[i][j] - v));\n      const mxv = Math.max(...g1.flat(), ...g2.flat()), mxd = Math.max(...gd.flat().map(Math.abs));\n      maps = [\n        { title: '2006', note: 'stems per 5×5 m cell', svg: this.heatSvg(g1, 'n', mxv) },\n        { title: '2016', note: 'stems per 5×5 m cell', svg: this.heatSvg(g2, 'n', mxv) },\n        { title: 'Change', note: 'green gained · orange lost', svg: this.heatSvg(gd, 'delta', mxd) }\n      ];\n    }\n    let hv = {}, hasHover = false;\n    if (isPlot && s.hover != null && D.trees[s.hover] && D.trees[s.hover].p === s.plot) {\n      const t = D.trees[s.hover], sp = D.species[t.s];\n      const stt = t.d[1] != null && t.d[2] != null ? ['Survived', 'tag tag-accent-2'] : t.d[1] != null ? ['Lost after 2006', 'tag tag-accent'] : ['Recruited by 2016', 'tag tag-neutral'];\n      hasHover = true;\n      hv = { name: sp.name, local: sp.local, color: sp.color, status: stt[0], tagCls: stt[1], d1: t.d[1] != null ? t.d[1] + ' cm' : '—', d2: t.d[2] != null ? t.d[2] + ' cm' : '—', h1: t.h[1] != null ? t.h[1].toFixed(1) + ' m' : '—', h2: t.h[2] != null ? t.h[2].toFixed(1) + ' m' : '—', pos: t.y != null ? `Position X ${t.x} m · Y ${t.y} m` : 'Position not recorded' };\n    }\n\n    // species rows\n    const A1 = this.sel(1, { anySp: true }), A2 = this.sel(2, { anySp: true });\n    const c1 = {}, c2 = {};\n    A1.forEach(t => { c1[t.s] = (c1[t.s] || 0) + 1; });\n    A2.forEach(t => { c2[t.s] = (c2[t.s] || 0) + 1; });\n    const allS = [...new Set([...Object.keys(c1), ...Object.keys(c2)])].map(Number).sort((a, b) => ((c1[b] || 0) + (c2[b] || 0)) - ((c1[a] || 0) + (c2[a] || 0)));\n    const topS = allS.slice(0, 12), smax = Math.max(1, ...topS.map(k => Math.max(c1[k] || 0, c2[k] || 0)));\n    const spRows = topS.map(k => {\n      const a = c1[k] || 0, b = c2[k] || 0;\n      return { name: D.species[k].name, local: D.species[k].local, c: D.species[k].color, a, b, wa: `max(2px, ${a / smax * 80}%)`, wb: `max(2px, ${b / smax * 80}%)`, d: pctL(a, b), tagCls: b > a ? 'tag tag-accent-2' : b < a ? 'tag tag-accent' : 'tag tag-neutral', bg: s.sp === k ? 'var(--color-accent-2-200)' : 'transparent', pick: () => this.setState({ sp: s.sp === k ? 'all' : k, hover: null }) };\n    });\n    const gone = Object.keys(c1).filter(k => !c2[k]).length, gained = Object.keys(c2).filter(k => !c1[k]).length;\n    const spFoot = `${allS.length} species in view${allS.length > 12 ? ', top 12 shown' : ''}. ${gone} species recorded in 2006 were absent in 2016; ${gained} appeared only in 2016.`;\n\n    // growth\n    const Sv = D.trees.filter(t => t.d[1] != null && t.d[2] != null && (!isPlot || t.p === s.plot) && (s.sp === 'all' || t.s === s.sp) && this.inSize(t, 1));\n    const gs = {};\n    Sv.forEach(t => { (gs[t.s] = gs[t.s] || []).push(t); });\n    const minN = isPlot ? 2 : 8;\n    const gl = Object.keys(gs).filter(k => gs[k].length >= minN).map(k => {\n      const T = gs[k];\n      return { k, n: T.length, dd: mean(T.map(t => t.d[2] - t.d[1])), dh: mean(T.filter(t => t.h[2] != null).map(t => t.h[2] - t.h[1])) };\n    }).sort((a, b) => b.dd - a.dd).slice(0, 10);\n    const gmax = Math.max(0.1, ...gl.map(g => Math.abs(g.dd)));\n    const growth = gl.map(g => ({ name: D.species[g.k].name, n: g.n, w: `max(2px, ${Math.max(0, g.dd) / gmax * 72}%)`, dd: (g.dd >= 0 ? '+' : '') + g.dd.toFixed(1) + ' cm', dh: isNaN(g.dh) ? '–' : (g.dh >= 0 ? '+' : '') + g.dh.toFixed(1) + ' m' }));\n    const allG = mean(Sv.map(t => t.d[2] - t.d[1]));\n    const growthFoot = Sv.length ? `${fmt(Sv.length)} survivors averaged ${f1(allG)} cm DBH gain (${(allG / 10 * 10).toFixed(1)} mm/yr). Species with at least ${minN} survivors shown.` : 'No surviving trees match these filters.';\n\n    // plot bars\n    const pm = Math.max(1, ...plotDelta.map(x => Math.abs(x.d)));\n    const plotBars = plotDelta.map(x => {\n      const on = s.plot === x.p;\n      return { tip: `Plot ${x.p}: ${x.a} → ${x.b} (${sgn(x.d)})`, up: x.d > 0 ? (x.d / pm * 100) + '%' : '0%', dn: x.d < 0 ? (-x.d / pm * 100) + '%' : '0%', upc: on ? '#3d472b' : '#728157', dnc: on ? '#8c491a' : '#c67139', bg: on ? 'var(--color-accent-2-200)' : 'transparent', pick: () => this.setState({ plot: on ? 'all' : x.p, hover: null }) };\n    });\n\n    const opt = (arr, cur, key) => arr.map((o, i) => ({ l: o.l, on: cur === i, pick: () => this.setState({ [key]: i, hover: null }) }));\n    const notes = [\n      'Survey columns in the source are labelled 2005 and 2016; the first survey is presented here as 2006, as specified by the team.',\n      `Density and basal area assume ${P.plotSize ?? 25} × ${P.plotSize ?? 25} m plots (${(this.area()).toFixed(4)} ha each).`,\n      '241 records with no DBH or height in either survey were excluded; 39 trees in 2016 have DBH but no height and are left out of height statistics only.',\n      '2006 heights carry many decimals and closely follow DBH, suggesting they were estimated from a height–diameter model; 2016 heights look field-measured, so compare height change with care.'\n    ];\n    return {\n      ready: true, headline, scopeLabel, subline, kpis, insights, demo, demoStats,\n      annualMort: `${fmt(died)} lost · ${fmt(rec)} recruited`,\n      classCharts, axisCharts, maps, legend, isPlot, hasHover, noHover: !hasHover, hv,\n      mapTitle: isPlot ? `Plot ${s.plot} — tree positions` : 'Where trees stand within plots',\n      mapSub: isPlot ? 'Each bubble is a tree at its X/Y position; bubble size scales with DBH.' : 'All plots overlaid on a common 25 × 25 m frame. Select a plot (filter above or bar chart below) to see individual trees.',\n      colorOpts: [{ l: 'Species', on: cb === 'species', pick: () => this.setState({ colorBy: 'species' }) }, { l: 'Survival', on: cb === 'status', pick: () => this.setState({ colorBy: 'status' }) }],\n      spRows, spFoot, growth, growthFoot, plotBars,\n      plotMaxLbl: '+' + pm, plotMinLbl: '−' + pm, plotFirst: D.plots[0], plotLast: D.plots[D.plots.length - 1],\n      plotOpts: [...plotOptsBase, ...D.plots.map(p => ({ v: p, l: `Plot ${p}` }))], plotVal: s.plot,\n      spOpts: [{ v: 'all', l: 'All species' }, ...D.species.map((x, i) => ({ v: String(i), l: `${x.name} (${x.local})` }))], spVal: String(s.sp),\n      onPlot: e => this.setState({ plot: e.target.value, hover: null }),\n      onSp: e => this.setState({ sp: e.target.value === 'all' ? 'all' : +e.target.value, hover: null }),\n      dbhOpts: opt(DBHC, s.dbh, 'dbh'), htOpts: opt(HC, s.ht, 'ht'),\n      filtered: isPlot || s.sp !== 'all' || !!s.dbh || !!s.ht,\n      reset: () => this.setState({ plot: 'all', sp: 'all', dbh: 0, ht: 0, hover: null }),\n      showNotes: P.showNotes ?? true, notes,\n      pdfOpen: s.pdfOpen, pdfMsg: s.pdfMsg,\n      openPdf: () => this.setState({ pdfOpen: true, pdfPlot: isPlot ? s.plot : D.plots[0], pdfMsg: '' }),\n      closePdf: () => this.setState({ pdfOpen: false }), stop: e => e.stopPropagation(),\n      pdfPlotOpts: [...D.plots.map(p => ({ v: p, l: `Plot ${p}` })), { v: 'all', l: 'All plots (65 pages)' }], pdfPlotVal: s.pdfPlot,\n      onPdfPlot: e => this.setState({ pdfPlot: e.target.value }),\n      pdfYearOpts: [1, 2].map(y => ({ l: Y[y], on: s.pdfYear === y, pick: () => this.setState({ pdfYear: y }) })),\n      genPdf: () => this.genPdf()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
